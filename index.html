<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Notes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 30px 15px;
      background-color: #090a1a;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(120, 40, 200, 0.35), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(30, 100, 220, 0.3), transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(180, 40, 140, 0.25), transparent 50%),
        radial-gradient(1.5px 1.5px at 15% 10%, #fff, transparent),
        radial-gradient(1px 1px at 45% 25%, #e2e8f0, transparent),
        radial-gradient(2px 2px at 75% 15%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 85% 65%, #cbd5e1, transparent),
        radial-gradient(1px 1px at 25% 75%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 60% 80%, #e2e8f0, transparent);
      background-attachment: fixed;
    }

    .container { max-width: 820px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.7rem; letter-spacing: 0.5px; }

    .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
    .user-info img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }

    .glass {
      background: rgba(18, 22, 42, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .login-box { text-align: center; padding: 50px 20px; margin-top: 40px; }
    .login-box p { color: #cbd5e1; margin: 12px 0 22px; }

    .editor-box { margin-bottom: 20px; }
    .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }

    input[type="text"], select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: #818cf8; }
    select option { background: #161b33; color: #fff; }
    #noteTitle { flex: 1; min-width: 200px; }

    .toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .toolbar button {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border: none;
      padding: 6px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .toolbar button:hover { background: rgba(129, 140, 248, 0.45); }

    #noteContent {
      min-height: 120px;
      max-height: 360px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 12px;
      line-height: 1.55;
      outline: none;
    }
    #noteContent:empty:before { content: attr(data-placeholder); color: #94a3b8; }
    #noteContent ul, #noteContent ol, .note-body ul, .note-body ol { padding-left: 22px; }

    #noteContent img, .note-body img {
      max-width: 100%;
      border-radius: 8px;
      margin: 8px 0;
      display: block;
      cursor: zoom-in;
    }

    .actions { display: flex; gap: 10px; margin-top: 12px; justify-content: flex-end; }
    .btn {
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      font-size: 0.9rem;
    }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #a855f7); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: rgba(255, 255, 255, 0.14); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.22); }

    .filter-bar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    #searchInput { flex: 1; min-width: 220px; }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }
    .note-card { display: flex; flex-direction: column; justify-content: space-between; }
    .note-header { display: flex; justify-content: space-between; align-items: start; gap: 8px; margin-bottom: 8px; }
    .note-title { font-size: 1.05rem; font-weight: 600; word-break: break-word; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(129, 140, 248, 0.25);
      color: #c7d2fe;
      white-space: nowrap;
    }
    .note-body {
      font-size: 0.92rem;
      color: #e2e8f0;
      line-height: 1.5;
      margin-bottom: 14px;
      word-break: break-word;
    }
    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      font-size: 0.78rem;
      color: #94a3b8;
    }
    .note-btns button {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f1f5f9;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-left: 5px;
    }
    .note-btns .del-btn:hover { background: #ef4444; border-color: #ef4444; }
    .note-btns .edit-btn:hover { background: #6366f1; border-color: #6366f1; }
    .empty { text-align: center; color: #94a3b8; grid-column: 1 / -1; padding: 30px; }
    .hidden { display: none !important; }

    /* Xem ảnh phóng to */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; padding: 20px; cursor: zoom-out;
    }
    .modal img { max-width: 95%; max-height: 92vh; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>✨ Galaxy Notes</h1>
      <div id="userBar" class="user-info hidden">
        <img id="userAvatar" src="" alt="">
        <span id="userName"></span>
        <button class="btn btn-secondary" onclick="logout()">Đăng xuất</button>
      </div>
    </div>

    <div id="loginView" class="glass login-box">
      <h2>Đồng bộ ghi chú mọi thiết bị</h2>
      <p>Đăng nhập bằng tài khoản Google để lưu và xem ghi chú trên điện thoại lẫn máy tính.</p>
      <button class="btn btn-primary" onclick="login()">Đăng nhập với Google</button>
    </div>

    <div id="appView" class="hidden">
      <div class="glass editor-box">
        <div class="row">
          <input type="text" id="noteTitle" placeholder="Tiêu đề ghi chú...">
          <select id="noteCategory">
            <option value="Chung">Chung</option>
            <option value="Học tập">Học tập</option>
            <option value="Công việc">Công việc</option>
            <option value="Ý tưởng">Ý tưởng</option>
            <option value="Cá nhân">Cá nhân</option>
          </select>
        </div>

        <div class="toolbar">
          <button type="button" onmousedown="event.preventDefault()" onclick="format('bold')"><b>B</b></button>
          <button type="button" onmousedown="event.preventDefault()" onclick="format('italic')"><i>I</i></button>
          <button type="button" onmousedown="event.preventDefault()" onclick="format('underline')"><u>U</u></button>
          <button type="button" onmousedown="event.preventDefault()" onclick="format('insertUnorderedList')">• Danh sách</button>
          <button type="button" onmousedown="event.preventDefault()" onclick="format('insertOrderedList')">1. Đánh số</button>
          <button type="button" onclick="document.getElementById('imageInput').click()">🖼️ Thêm ảnh</button>
          <button type="button" onmousedown="event.preventDefault()" onclick="format('removeFormat')">Xóa định dạng</button>
          <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
        </div>

        <div id="noteContent" contenteditable="true" data-placeholder="Nhập nội dung hoặc dán ảnh (Ctrl+V)..."></div>

        <div class="actions">
          <button id="cancelBtn" class="btn btn-secondary hidden" onclick="resetForm()">Hủy</button>
          <button id="saveBtn" class="btn btn-primary" onclick="saveNote()">Lưu ghi chú</button>
        </div>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 Tìm theo tiêu đề hoặc nội dung..." oninput="renderNotes()">
        <select id="filterCategory" onchange="renderNotes()">
          <option value="Tất cả">Tất cả phân loại</option>
          <option value="Chung">Chung</option>
          <option value="Học tập">Học tập</option>
          <option value="Công việc">Công việc</option>
          <option value="Ý tưởng">Ý tưởng</option>
          <option value="Cá nhân">Cá nhân</option>
        </select>
      </div>

      <div id="noteList" class="notes-grid"></div>
    </div>
  </div>

  <!-- Khung phóng to ảnh -->
  <div id="imgModal" class="modal hidden" onclick="this.classList.add('hidden')">
    <img id="modalImg" src="" alt="">
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFeUJv7zDWWh-M0KF4Ly4WpGlMrYDOoXU",
      authDomain: "ghi-chu-77f2d.firebaseapp.com",
      projectId: "ghi-chu-77f2d",
      storageBucket: "ghi-chu-77f2d.firebasestorage.app",
      messagingSenderId: "1042373019331",
      appId: "1:1042373019331:web:a6f5399134a0c8c5834476",
      measurementId: "G-ECE19S8N3S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let notes = [];
    let editingId = null;
    let unsubscribe = null;

    // Nén ảnh trước khi chèn (tối đa rộng 700px, JPEG 0.7) để tiết kiệm dung lượng Firestore
    function compressAndInsertImage(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxWidth = 700;
          const scale = img.width > maxWidth ? maxWidth / img.width : 1;
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          const editor = document.getElementById('noteContent');
          editor.focus();
          document.execCommand('insertHTML', false, `<img src="${dataUrl}" alt="img"><br>`);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    window.handleImageUpload = (event) => {
      const file = event.target.files[0];
      compressAndInsertImage(file);
      event.target.value = '';
    };

    // Hỗ trợ dán ảnh trực tiếp bằng Ctrl + V
    document.getElementById('noteContent').addEventListener('paste', (e) => {
      const items = e.clipboardData?.items || [];
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          compressAndInsertImage(item.getAsFile());
          break;
        }
      }
    });

    // Nhấn vào ảnh trong danh sách ghi chú để phóng to
    document.getElementById('noteList').addEventListener('click', (e) => {
      if (e.target.tagName === 'IMG') {
        document.getElementById('modalImg').src = e.target.src;
        document.getElementById('imgModal').classList.remove('hidden');
      }
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('appView').classList.remove('hidden');
        document.getElementById('userBar').classList.remove('hidden');
        document.getElementById('userName').textContent = user.displayName || user.email;
        document.getElementById('userAvatar').src = user.photoURL || '';

        const q = query(collection(db, "users", user.uid, "notes"), orderBy("createdAt", "desc"));
        unsubscribe = onSnapshot(q, (snapshot) => {
          notes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          renderNotes();
        });
      } else {
        if (unsubscribe) unsubscribe();
        notes = [];
        resetForm();
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('appView').classList.add('hidden');
        document.getElementById('userBar').classList.add('hidden');
      }
    });

    window.login = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Lỗi đăng nhập: " + err.message);
      }
    };

    window.logout = () => signOut(auth);

    window.format = (cmd) => {
      document.execCommand(cmd, false, null);
      document.getElementById('noteContent').focus();
    };

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, m => ({ '&':'&', '<':'<', '>':'>', '"':'"', "'":''' }[m]));
    }

    window.saveNote = async () => {
      if (!currentUser) return;
      const title = document.getElementById('noteTitle').value.trim() || 'Không có tiêu đề';
      const category = document.getElementById('noteCategory').value;
      const contentEl = document.getElementById('noteContent');
      const content = contentEl.innerHTML.trim();

      if (!contentEl.innerText.trim() && !contentEl.querySelector('img')) return;

      // Firestore giới hạn 1MB mỗi ghi chú
      if (new Blob([content]).size > 900000) {
        alert("Ghi chú có quá nhiều ảnh (vượt giới hạn ~900KB). Hãy tách sang ghi chú mới.");
        return;
      }

      const time = new Date().toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });

      try {
        if (editingId) {
          await updateDoc(doc(db, "users", currentUser.uid, "notes", editingId), { title, category, content, updatedAt: time });
        } else {
          await addDoc(collection(db, "users", currentUser.uid, "notes"), { title, category, content, updatedAt: time, createdAt: Date.now() });
        }
        resetForm();
      } catch (err) {
        alert("Lỗi khi lưu: " + err.message);
      }
    };

    window.editNote = (id) => {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      editingId = id;
      document.getElementById('noteTitle').value = note.title;
      document.getElementById('noteCategory').value = note.category;
      document.getElementById('noteContent').innerHTML = note.content;
      document.getElementById('saveBtn').textContent = 'Cập nhật';
      document.getElementById('cancelBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteNote = async (id) => {
      if (!currentUser) return;
      await deleteDoc(doc(db, "users", currentUser.uid, "notes", id));
      if (editingId === id) resetForm();
    };

    window.resetForm = () => {
      editingId = null;
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteCategory').value = 'Chung';
      document.getElementById('noteContent').innerHTML = '';
      document.getElementById('saveBtn').textContent = 'Lưu ghi chú';
      document.getElementById('cancelBtn').classList.add('hidden');
    };

    window.renderNotes = () => {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filterCat = document.getElementById('filterCategory').value;
      const list = document.getElementById('noteList');

      const filtered = notes.filter(n => {
        const matchCat = filterCat === 'Tất cả' || n.category === filterCat;
        const plainText = n.content.replace(/<[^>]*>/g, '').toLowerCase();
        const matchText = n.title.toLowerCase().includes(keyword) || plainText.includes(keyword);
        return matchCat && matchText;
      });

      if (!filtered.length) {
        list.innerHTML = '<div class="glass empty">Chưa có ghi chú nào phù hợp.</div>';
        return;
      }

      list.innerHTML = filtered.map(n => `
        <div class="glass note-card">
          <div>
            <div class="note-header">
              <div class="note-title">${escapeHTML(n.title)}</div>
              <span class="badge">${escapeHTML(n.category)}</span>
            </div>
            <div class="note-body">${n.content}</div>
          </div>
          <div class="note-footer">
            <span>${n.updatedAt || ''}</span>
            <div class="note-btns">
              <button class="edit-btn" onclick="editNote('${n.id}')">Sửa</button>
              <button class="del-btn" onclick="deleteNote('${n.id}')">Xóa</button>
            </div>
          </div>
        </div>
      `).join('');
    };
  </script>
</body>
</html>
