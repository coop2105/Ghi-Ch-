<!DOCTYPE html
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Notes</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 30px 15px;
      background-color: #090a1a;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(120, 40, 200, 0.35), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(30, 100, 220, 0.3), transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(180, 40, 140, 0.25), transparent 50%),
        radial-gradient(1.5px 1.5px at 15% 10%, #fff, transparent),
        radial-gradient(1px 1px at 45% 25%, #e2e8f0, transparent),
        radial-gradient(2px 2px at 75% 15%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 85% 65%, #cbd5e1, transparent),
        radial-gradient(1px 1px at 25% 75%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 60% 80%, #e2e8f0, transparent);
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      transition: background 0.35s ease;
    }

    .container { max-width: 820px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.7rem; letter-spacing: 0.5px; }

    .user-info { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }
    .user-info img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }

    .glass {
      background: rgba(18, 22, 42, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    /* Nút hành tinh + Tên chức năng bên dưới */
    .planet-btn {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      padding: 2px 4px;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .planet-btn svg, .planet-btn span { position: relative; z-index: 2; }
    .planet-btn svg {
      width: 38px;
      height: 38px;
      padding: 6px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      display: block;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .planet-btn span {
      font-size: 0.7rem;
      line-height: 1.1;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    }
    .planet-btn:hover { transform: translateY(-2px); color: #fff; }
    .planet-btn:hover svg {
      transform: scale(1.08);
      background: rgba(129, 140, 248, 0.25);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.55);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* Trạng thái giữ sáng kiểu tia lửa mặt trời */
    .planet-btn.active { color: #fef08a; }
    .planet-btn.active::before {
      content: "";
      position: absolute;
      top: 20px;
      left: 50%;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(254, 240, 138, 0.9) 0deg 8deg,
        rgba(249, 115, 22, 0.85) 8deg 18deg,
        transparent 18deg 36deg
      );
      filter: blur(2.5px);
      transform: translate(-50%, -50%);
      animation: solarSpin 6s linear infinite, solarFlicker 1.6s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }
    .planet-btn.active::after {
      content: "";
      position: absolute;
      top: 20px;
      left: 50%;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.9) 15%, rgba(249, 115, 22, 0.75) 50%, rgba(220, 38, 38, 0) 75%);
      filter: blur(4px);
      transform: translate(-50%, -50%);
      animation: solarFlicker 1.2s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }
    .planet-btn.sm.active::before { top: 18px; width: 48px; height: 48px; }
    .planet-btn.sm.active::after { top: 18px; width: 42px; height: 42px; }
    .planet-btn.active svg {
      background: radial-gradient(circle, rgba(254, 240, 138, 0.35), rgba(234, 88, 12, 0.55));
      border-color: #fef08a;
      box-shadow:
        0 0 8px #fef08a,
        0 0 18px #f97316,
        0 0 30px #dc2626;
      transform: scale(1.1);
    }
    .planet-btn.active span {
      font-weight: 700;
      text-shadow: 0 0 6px #fef08a, 0 0 12px #f97316;
    }

    @keyframes solarSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes solarFlicker {
      from { opacity: 0.75; filter: blur(2.5px) brightness(1); }
      to   { opacity: 1; filter: blur(3.5px) brightness(1.35); }
    }

    .planet-btn.lg svg { width: 58px; height: 58px; padding: 8px; }
    .planet-btn.lg span { font-size: 0.85rem; font-weight: 600; margin-top: 2px; }
    .planet-btn.sm svg { width: 32px; height: 32px; padding: 4px; }
    .planet-btn.sm span { font-size: 0.66rem; }
    .planet-btn.danger:hover svg {
      background: rgba(239, 68, 68, 0.3);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.65);
    }

    .login-box { text-align: center; padding: 50px 20px; margin-top: 40px; }
    .login-box p { color: #cbd5e1; margin: 12px 0 22px; }

    .editor-box { margin-bottom: 20px; transition: background 0.3s ease; background-size: cover; background-position: center; }
    .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }

    input[type="text"], select {
      background: rgba(15, 20, 40, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: #818cf8; }
    select option { background: #161b33; color: #fff; }
    #noteTitle { flex: 1; min-width: 200px; }

    .toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .toolbar .planet-btn {
      width: 66px;
    }

    /* Thanh chọn background */
    .bg-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: rgba(9, 12, 28, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .bg-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .bg-swatch:hover { transform: scale(1.15); border-color: #fff; }
    .bg-color-input {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    #noteContent {
      min-height: 120px;
      max-height: 360px;
      overflow-y: auto;
      background: rgba(10, 14, 30, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 12px;
      line-height: 1.55;
      outline: none;
    }
    #noteContent:empty:before { content: attr(data-placeholder); color: #94a3b8; }
    #noteContent ul, #noteContent ol, .note-body ul, .note-body ol { padding-left: 22px; }

    #noteContent img, .note-body img {
      max-width: 100%;
      border-radius: 8px;
      margin: 8px 0;
      display: block;
      cursor: zoom-in;
    }
    .note-toggle {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 10px;
      margin: 8px 0;
    }
    .note-toggle summary {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 30px;
      cursor: pointer;
      outline: none;
    }
    .toggle-title, .note-toggle .toggle-body {
      background: rgba(15, 20, 40, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      outline: none;
    }
    .toggle-title {
      flex: 1;
      font-weight: 600;
      min-height: 36px;
    }
    .note-toggle .toggle-body {
      margin-top: 8px;
      min-height: 64px;
    }
    .toggle-title:focus, .note-toggle .toggle-body:focus {
      border-color: #818cf8;
    }
    .toggle-title:empty:before, .note-toggle .toggle-body:empty:before {
      content: attr(data-placeholder);
      color: #94a3b8;
      font-weight: 400;
    }
    .toggle-del {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: none;
      border-radius: 4px;
      width: 20px;
      height: 20px;
      line-height: 18px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
    }
    .toggle-del:hover { background: #ef4444; color: #fff; }
    .note-body .toggle-del { display: none; }

    .actions { display: flex; gap: 14px; margin-top: 12px; justify-content: flex-end; align-items: center; }

    .filter-bar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    #searchInput { flex: 1; min-width: 220px; }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }
    .note-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-size: cover;
      background-position: center;
      transition: transform 0.2s ease;
    }
    .note-card:hover { transform: translateY(-2px); }
    .note-header { display: flex; justify-content: space-between; align-items: start; gap: 8px; margin-bottom: 8px; }
    .note-title { font-size: 1.05rem; font-weight: 600; word-break: break-word; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255,255,255,0.2);
      color: #c7d2fe;
      white-space: nowrap;
    }
    .note-body {
      font-size: 0.92rem;
      color: #f1f5f9;
      line-height: 1.5;
      margin-bottom: 14px;
      word-break: break-word;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      padding-top: 10px;
      font-size: 0.78rem;
      color: #cbd5e1;
    }
    .note-btns { display: flex; gap: 8px; }
    .empty { text-align: center; color: #94a3b8; grid-column: 1 / -1; padding: 30px; }
    .hidden { display: none !important; }

    /* Modal chung */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; padding: 20px;
    }
    .modal.zoom { cursor: zoom-out; }
    .modal.zoom img { max-width: 95%; max-height: 92vh; border-radius: 10px; }
    .modal-card { max-width: 440px; width: 100%; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>✨ Galaxy Notes</h1>
      <div class="user-info">
        <button id="lobbyBgBtn" class="planet-btn" onclick="toggleLobbyModal(true)">
          <svg viewBox="0 0 36 36"><defs><linearGradient id="uranus" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs><circle cx="18" cy="18" r="10" fill="url(#uranus)"/><ellipse cx="18" cy="18" rx="16" ry="5" fill="none" stroke="#bae6fd" stroke-width="2" transform="rotate(-25 18 18)"/></svg>
          <span>Nền sảnh</span>
        </button>
        <div id="userBar" class="user-info hidden">
          <img id="userAvatar" src="" alt="">
          <span id="userName"></span>
          <button class="planet-btn danger" onclick="logout()">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/><circle cx="18" cy="18" r="9" fill="#020617" stroke="#fb923c" stroke-width="1.5"/></svg>
            <span>Đăng xuất</span>
          </button>
        </div>
      </div>
    </div>

    <div id="loginView" class="glass login-box">
      <h2>Đồng bộ ghi chú mọi thiết bị</h2>
      <p>Đăng nhập bằng tài khoản Google để lưu và xem ghi chú trên điện thoại lẫn máy tính.</p>
      <button class="planet-btn lg" onclick="login()">
        <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="#2563eb"/><path d="M11 10c3-1 6 1 5 4s-4 3-3 6 4 4 2 7c-5-1-9-6-9-11 0-2 2-5 5-6zm13 2c2 2 3 5 2 8-2 1-4-1-5-3s1-4 3-5z" fill="#22c55e"/><circle cx="18" cy="18" r="14" fill="none" stroke="#93c5fd" stroke-width="1.2"/></svg>
        <span>Đăng nhập Google</span>
      </button>
    </div>

    <div id="appView" class="hidden">
      <div id="editorBox" class="glass editor-box">
        <div class="row">
          <input type="text" id="noteTitle" placeholder="Tiêu đề ghi chú...">
          <select id="noteCategory">
            <option value="Chung">Chung</option>
            <option value="Học tập">Học tập</option>
            <option value="Công việc">Công việc</option>
            <option value="Ý tưởng">Ý tưởng</option>
            <option value="Cá nhân">Cá nhân</option>
          </select>
        </div>

        <div class="toolbar">
          <button type="button" class="planet-btn sm" data-cmd="bold" onmousedown="event.preventDefault()" onclick="format('bold')">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="#ef4444"/><circle cx="13" cy="14" r="3" fill="#b91c1c"/><circle cx="23" cy="22" r="2.5" fill="#dc2626"/><text x="18" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">B</text></svg>
            <span>In đậm</span>
          </button>
          <button type="button" class="planet-btn sm" data-cmd="italic" onmousedown="event.preventDefault()" onclick="format('italic')">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="9" fill="#f59e0b"/><ellipse cx="18" cy="18" rx="16" ry="4.5" fill="none" stroke="#fde68a" stroke-width="2" transform="rotate(-20 18 18)"/><text x="18" y="22" text-anchor="middle" fill="#1e1b4b" font-size="12" font-style="italic" font-weight="800">I</text></svg>
            <span>In nghiêng</span>
          </button>
          <button type="button" class="planet-btn sm" data-cmd="underline" onmousedown="event.preventDefault()" onclick="format('underline')">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="#3b82f6"/><path d="M8 22h20" stroke="#93c5fd" stroke-width="2"/><text x="18" y="21" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" text-decoration="underline">U</text></svg>
            <span>Gạch chân</span>
          </button>
          <button type="button" class="planet-btn sm" data-cmd="insertUnorderedList" onmousedown="event.preventDefault()" onclick="format('insertUnorderedList')">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="#d97706"/><path d="M6 14h24M5 19h26M7 24h22" stroke="#fef3c7" stroke-width="2" opacity="0.7"/><circle cx="22" cy="19" r="2.5" fill="#dc2626"/></svg>
            <span>Danh sách</span>
          </button>
          <button type="button" class="planet-btn sm" data-cmd="insertOrderedList" onmousedown="event.preventDefault()" onclick="format('insertOrderedList')">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="12" fill="#94a3b8"/><circle cx="13" cy="13" r="2.5" fill="#64748b"/><circle cx="22" cy="21" r="3" fill="#475569"/><text x="18" y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1.</text></svg>
            <span>Đánh số</span>
          </button>
          <button type="button" class="planet-btn sm" onclick="document.getElementById('imageInput').click()">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="#0ea5e9"/><path d="M10 14c3-2 6 0 6 3s-2 5-5 5-3-5-1-8zm12 2c2 0 4 2 3 5-2 1-4-1-3-5z" fill="#4ade80"/></svg>
            <span>Thêm ảnh</span>
          </button>
          <button type="button" id="noteBgBtn" class="planet-btn sm" onclick="toggleNoteBgPanel()">
            <svg viewBox="0 0 36 36"><defs><linearGradient id="venus" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs><circle cx="18" cy="18" r="12" fill="url(#venus)"/><circle cx="13" cy="13" r="3" fill="#fbcfe8" opacity="0.5"/></svg>
            <span>Nền note</span>
          </button>
          <button type="button" class="planet-btn sm" onmousedown="event.preventDefault()" onclick="insertToggle()">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="11" fill="#10b981"/><path d="M13 15l5 6 5-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Mục gập</span>
          </button>
          <button type="button" class="planet-btn sm" onmousedown="event.preventDefault()" onclick="format('removeFormat')">
            <svg viewBox="0 0 36 36"><path d="M22 7a11 11 0 1 0 7 19A9 9 0 1 1 22 7z" fill="#e2e8f0"/></svg>
            
            <span>Xóa kiểu</span>
          </button>
          <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
        </div>

        <!-- Bảng chọn nền cho từng Note -->
        <div id="noteBgPanel" class="bg-panel hidden">
          <div class="bg-swatch" title="Mặc định" style="background: rgba(18,22,42,0.85)" onclick="setNoteBg('')"></div>
          <div class="bg-swatch" title="Tinh vân Tím" style="background: linear-gradient(135deg, #31105f, #6d28d9)" onclick="setNoteBg('linear-gradient(135deg, rgba(49,16,95,0.88), rgba(109,40,217,0.82))')"></div>
          <div class="bg-swatch" title="Đại dương Sao Hải Vương" style="background: linear-gradient(135deg, #0f294a, #0284c7)" onclick="setNoteBg('linear-gradient(135deg, rgba(15,41,74,0.88), rgba(2,132,199,0.8))')"></div>
          <div class="bg-swatch" title="Bão Sao Hỏa" style="background: linear-gradient(135deg, #5c1313, #c2410c)" onclick="setNoteBg('linear-gradient(135deg, rgba(92,19,19,0.88), rgba(194,65,12,0.8))')"></div>
          <div class="bg-swatch" title="Cực quang Xanh" style="background: linear-gradient(135deg, #064e3b, #0d9488)" onclick="setNoteBg('linear-gradient(135deg, rgba(6,78,59,0.88), rgba(13,148,136,0.8))')"></div>
          <div class="bg-swatch" title="Ngân hà Hồng" style="background: linear-gradient(135deg, #500724, #be185d)" onclick="setNoteBg('linear-gradient(135deg, rgba(80,7,36,0.88), rgba(190,24,93,0.8))')"></div>
          <input type="color" class="bg-color-input" title="Chọn màu nền tùy ý" onchange="setNoteBg(this.value)">
          <button type="button" class="planet-btn sm" onclick="document.getElementById('noteBgInput').click()">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="12" fill="#a855f7"/><circle cx="14" cy="14" r="3" fill="#fde047"/><path d="M9 24l6-6 4 4 3-3 5 5z" fill="#e9d5ff"/></svg>
            <span>Ảnh nền</span>
          </button>
          <input type="file" id="noteBgInput" accept="image/*" style="display:none" onchange="handleNoteBgUpload(event)">
        </div>

        <div id="noteContent" contenteditable="true" data-placeholder="Nhập nội dung hoặc dán ảnh (Ctrl+V)..."></div>

        <div class="actions">
          <button id="cancelBtn" class="planet-btn danger hidden" onclick="resetForm()">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="#475569"/><path d="M13 13l10 10M23 13L13 23" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round"/></svg>
            <span>Hủy</span>
          </button>
          <button id="saveBtn" class="planet-btn" onclick="saveNote()">
            <svg viewBox="0 0 36 36"><defs><radialGradient id="sun"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#f97316"/></radialGradient></defs><circle cx="18" cy="18" r="11" fill="url(#sun)"/><path d="M18 2v4M18 30v4M2 18h4M30 18h4M6.7 6.7l2.8 2.8M26.5 26.5l2.8 2.8M29.3 6.7l-2.8 2.8M9.5 26.5l-2.8 2.8" stroke="#fde047" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Lưu</span>
          </button>
        </div>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 Tìm theo tiêu đề hoặc nội dung..." oninput="renderNotes()">
        <select id="filterCategory" onchange="renderNotes()">
          <option value="Tất cả">Tất cả phân loại</option>
          <option value="Chung">Chung</option>
          <option value="Học tập">Học tập</option>
          <option value="Công việc">Công việc</option>
          <option value="Ý tưởng">Ý tưởng</option>
          <option value="Cá nhân">Cá nhân</option>
        </select>
      </div>

      <div id="noteList" class="notes-grid"></div>
    </div>
  </div>

  <!-- Modal tùy chỉnh nền Sảnh Chính -->
  <div id="lobbyModal" class="modal hidden" onclick="if(event.target===this) toggleLobbyModal(false)">
    <div class="glass modal-card">
      <div class="modal-header">
        <h3>🌌 Nền sảnh chính</h3>
        <button class="planet-btn sm danger" onclick="toggleLobbyModal(false)">
          <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="#334155"/><path d="M13 13l10 10M23 13L13 23" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
          <span>Đóng</span>
        </button>
      </div>
      <div class="bg-panel" style="margin-bottom:0">
        <div class="bg-swatch" title="Mặc định Galaxy" style="background: #090a1a" onclick="setLobbyBg('')"></div>
        <div class="bg-swatch" title="Tinh vân Tím Hồng" style="background: linear-gradient(135deg, #1e1b4b, #701a75, #0f172a)" onclick="setLobbyBg('linear-gradient(135deg, #1e1b4b, #701a75, #0f172a)')"></div>
        <div class="bg-swatch" title="Hố sâu Vũ trụ" style="background: linear-gradient(135deg, #020617, #0c4a6e, #020617)" onclick="setLobbyBg('linear-gradient(135deg, #020617, #0c4a6e, #020617)')"></div>
        <div class="bg-swatch" title="Hoàng hôn Sao Hỏa" style="background: linear-gradient(135deg, #2a0a0a, #7c2d12, #1e1b4b)" onclick="setLobbyBg('linear-gradient(135deg, #2a0a0a, #7c2d12, #1e1b4b)')"></div>
        <div class="bg-swatch" title="Cực quang Bắc Cực" style="background: linear-gradient(135deg, #022c22, #115e59, #0f172a)" onclick="setLobbyBg('linear-gradient(135deg, #022c22, #115e59, #0f172a)')"></div>
        <input type="color" class="bg-color-input" title="Chọn màu nền sảnh" onchange="setLobbyBg(this.value)">
        <button class="planet-btn sm" onclick="document.getElementById('lobbyBgInput').click()">
          <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="12" fill="#38bdf8"/><circle cx="14" cy="14" r="3" fill="#fde047"/><path d="M9 24l6-6 4 4 3-3 5 5z" fill="#e0f2fe"/></svg>
          <span>Ảnh nền</span>
        </button>
        <input type="file" id="lobbyBgInput" accept="image/*" style="display:none" onchange="handleLobbyBgUpload(event)">
      </div>
    </div>
  </div>

  <!-- Khung phóng to ảnh -->
  <div id="imgModal" class="modal zoom hidden" onclick="this.classList.add('hidden')">
    <img id="modalImg" src="" alt="">
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDoc, setDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFeUJv7zDWWh-M0KF4Ly4WpGlMrYDOoXU",
      authDomain: "ghi-chu-77f2d.firebaseapp.com",
      projectId: "ghi-chu-77f2d",
      storageBucket: "ghi-chu-77f2d.firebasestorage.app",
      messagingSenderId: "1042373019331",
      appId: "1:1042373019331:web:a6f5399134a0c8c5834476",
      measurementId: "G-ECE19S8N3S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let notes = [];
    let editingId = null;
    let unsubscribe = null;
    let currentNoteBg = '';

    // Cập nhật trạng thái sáng cho các nút định dạng
    function updateToolbarState() {
      document.querySelectorAll('.toolbar button[data-cmd]').forEach(btn => {
        const cmd = btn.getAttribute('data-cmd');
        try {
          btn.classList.toggle('active', document.queryCommandState(cmd));
        } catch {
          btn.classList.remove('active');
        }
      });
    }

    const editorEl = document.getElementById('noteContent');
    ['keyup', 'mouseup', 'focus', 'input'].forEach(evt => {
      editorEl.addEventListener(evt, updateToolbarState);
    });
    document.addEventListener('selectionchange', () => {
      if (document.activeElement === editorEl) updateToolbarState();
    });

    function compressImage(file, maxWidth, quality, callback) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const scale = img.width > maxWidth ? maxWidth / img.width : 1;
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function formatBgStyle(bg) {
      if (!bg) return '';
      if (bg.startsWith('data:image/')) {
        return `linear-gradient(rgba(9,10,26,0.55), rgba(9,10,26,0.72)), url("${bg}")`;
      }
      return bg;
    }

    // ===== NỀN SẢNH CHÍNH =====
    function applyLobbyBg(bg) {
      if (!bg) {
        document.body.style.background = '';
        document.body.style.backgroundImage = '';
      } else if (bg.startsWith('data:image/')) {
        document.body.style.background = `linear-gradient(rgba(9,10,26,0.45), rgba(9,10,26,0.6)), url("${bg}") center/cover fixed no-repeat`;
      } else {
        document.body.style.background = bg;
        document.body.style.backgroundAttachment = 'fixed';
      }
    }

    applyLobbyBg(localStorage.getItem('galaxy_lobby_bg') || '');

    window.toggleLobbyModal = (show) => {
      document.getElementById('lobbyModal').classList.toggle('hidden', !show);
      document.getElementById('lobbyBgBtn').classList.toggle('active', show);
    };

    window.setLobbyBg = async (bg) => {
      applyLobbyBg(bg);
      try { localStorage.setItem('galaxy_lobby_bg', bg); } catch {}
      if (currentUser) {
        try {
          await setDoc(doc(db, "users", currentUser.uid, "settings", "lobby"), { bg });
        } catch (err) {
          alert("Không lưu được nền sảnh lên đám mây: " + err.message);
        }
      }
    };

    window.handleLobbyBgUpload = (e) => {
      const file = e.target.files[0];
      compressImage(file, 1280, 0.72, (dataUrl) => setLobbyBg(dataUrl));
      e.target.value = '';
    };

    // ===== NỀN TỪNG NOTE =====
    window.toggleNoteBgPanel = () => {
      const panel = document.getElementById('noteBgPanel');
      const isHidden = panel.classList.toggle('hidden');
      document.getElementById('noteBgBtn').classList.toggle('active', !isHidden);
    };

    window.setNoteBg = (bg) => {
      currentNoteBg = bg;
      const box = document.getElementById('editorBox');
      box.style.background = bg ? formatBgStyle(bg) : '';
      if (bg && bg.startsWith('data:image/')) {
        box.style.backgroundSize = 'cover';
        box.style.backgroundPosition = 'center';
      }
    };

    window.handleNoteBgUpload = (e) => {
      const file = e.target.files[0];
      compressImage(file, 550, 0.65, (dataUrl) => setNoteBg(dataUrl));
      e.target.value = '';
    };

    // ===== CHÈN ẢNH VÀO NỘI DUNG NOTE =====
    window.handleImageUpload = (event) => {
      const file = event.target.files[0];
      compressImage(file, 700, 0.7, (dataUrl) => {
        editorEl.focus();
        document.execCommand('insertHTML', false, `<img src="${dataUrl}" alt="img"><br>`);
      });
      event.target.value = '';
    };

    editorEl.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items || [];
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          compressImage(item.getAsFile(), 700, 0.7, (dataUrl) => {
            document.execCommand('insertHTML', false, `<img src="${dataUrl}" alt="img"><br>`);
          });
          break;
        }
      }
    });

    document.getElementById('noteList').addEventListener('click', (e) => {
      if (e.target.tagName === 'IMG') {
        document.getElementById('modalImg').src = e.target.src;
        document.getElementById('imgModal').classList.remove('hidden');
      }
    });

    // ===== AUTH & FIRESTORE =====
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('appView').classList.remove('hidden');
        document.getElementById('userBar').classList.remove('hidden');
        document.getElementById('userName').textContent = user.displayName || user.email;
        document.getElementById('userAvatar').src = user.photoURL || '';

        try {
          const snap = await getDoc(doc(db, "users", user.uid, "settings", "lobby"));
          if (snap.exists() && snap.data().bg !== undefined) {
            applyLobbyBg(snap.data().bg);
            try { localStorage.setItem('galaxy_lobby_bg', snap.data().bg); } catch {}
          }
        } catch {}

        const q = query(collection(db, "users", user.uid, "notes"), orderBy("createdAt", "desc"));
        unsubscribe = onSnapshot(q, (snapshot) => {
          notes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          renderNotes();
        });
      } else {
        if (unsubscribe) unsubscribe();
        notes = [];
        resetForm();
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('appView').classList.add('hidden');
        document.getElementById('userBar').classList.add('hidden');
      }
    });

    window.login = async () => {
      try { await signInWithPopup(auth, provider); }
      catch (err) { alert("Lỗi đăng nhập: " + err.message); }
    };

    window.logout = () => signOut(auth);

    window.format = (cmd) => {
      editorEl.focus();
      document.execCommand(cmd, false, null);
      updateToolbarState();
    };
    window.insertToggle = () => {
      editorEl.focus();
      const html = `<details class="note-toggle" open contenteditable="false"><summary><span class="toggle-title" contenteditable="true" data-placeholder="Tiêu đề mục..."></span><button type="button" class="toggle-del" onclick="event.preventDefault(); this.closest('details').remove()">×</button></summary><div class="toggle-body" contenteditable="true" data-placeholder="Nhập nội dung..."></div></details><br>`;
      document.execCommand('insertHTML', false, html);
    };

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    window.saveNote = async () => {
      if (!currentUser) return;
      const title = document.getElementById('noteTitle').value.trim() || 'Không có tiêu đề';
      const category = document.getElementById('noteCategory').value;
      const content = editorEl.innerHTML.trim();

      if (!editorEl.innerText.trim() && !editorEl.querySelector('img')) return;

      if (new Blob([content, currentNoteBg]).size > 900000) {
        alert("Ghi chú vượt giới hạn ~900KB của Firestore. Hãy giảm bớt ảnh.");
        return;
      }

      const time = new Date().toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });

      try {
        if (editingId) {
          await updateDoc(doc(db, "users", currentUser.uid, "notes", editingId), {
            title, category, content, bg: currentNoteBg, updatedAt: time
          });
        } else {
          await addDoc(collection(db, "users", currentUser.uid, "notes"), {
            title, category, content, bg: currentNoteBg, updatedAt: time, createdAt: Date.now()
          });
        }
        resetForm();
      } catch (err) {
        alert("Lỗi khi lưu: " + err.message);
      }
    };

    window.editNote = (id) => {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      editingId = id;
      document.getElementById('noteTitle').value = note.title;
      document.getElementById('noteCategory').value = note.category;
      editorEl.innerHTML = note.content;
      setNoteBg(note.bg || '');
      document.querySelector('#saveBtn span').textContent = 'Cập nhật';
      document.getElementById('cancelBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteNote = async (id) => {
      if (!currentUser) return;
      await deleteDoc(doc(db, "users", currentUser.uid, "notes", id));
      if (editingId === id) resetForm();
    };

    window.resetForm = () => {
      editingId = null;
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteCategory').value = 'Chung';
      editorEl.innerHTML = '';
      setNoteBg('');
      document.getElementById('noteBgPanel').classList.add('hidden');
      document.getElementById('noteBgBtn').classList.remove('active');
      document.querySelector('#saveBtn span').textContent = 'Lưu';
      document.getElementById('cancelBtn').classList.add('hidden');
      updateToolbarState();
    };

    window.renderNotes = () => {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filterCat = document.getElementById('filterCategory').value;
      const list = document.getElementById('noteList');

      const filtered = notes.filter(n => {
        const matchCat = filterCat === 'Tất cả' || n.category === filterCat;
        const plainText = n.content.replace(/<[^>]*>/g, '').toLowerCase();
        const matchText = n.title.toLowerCase().includes(keyword) || plainText.includes(keyword);
        return matchCat && matchText;
      });

      if (!filtered.length) {
        list.innerHTML = '<div class="glass empty">Chưa có ghi chú nào phù hợp.</div>';
        return;
      }

      list.innerHTML = filtered.map(n => {
        const bgStyle = n.bg ? `style="background: ${formatBgStyle(n.bg)}; background-size: cover; background-position: center;"` : '';
        return `
        <div class="glass note-card" ${bgStyle}>
          <div>
            <div class="note-header">
              <div class="note-title">${escapeHTML(n.title)}</div>
              <span class="badge">${escapeHTML(n.category)}</span>
            </div>
            <div class="note-body">${n.content.replace(/contenteditable="true"/g, '')}</div>
          </div>
          <div class="note-footer">
            <span>${n.updatedAt || ''}</span>
            <div class="note-btns">
              <button class="planet-btn sm" onclick="editNote('${n.id}')">
                <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="9" fill="#818cf8"/><ellipse cx="18" cy="18" rx="15" ry="4.5" fill="none" stroke="#c7d2fe" stroke-width="2" transform="rotate(-25 18 18)"/></svg>
                <span>Sửa</span>
              </button>
              <button class="planet-btn sm danger" onclick="deleteNote('${n.id}')">
                <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="11" fill="#dc2626"/><circle cx="14" cy="14" r="2.5" fill="#991b1b"/><path d="M14 14l8 8M22 14l-8 8" stroke="#fecaca" stroke-width="2" stroke-linecap="round"/></svg>
                <span>Xóa</span>
              </button>
            </div>
          </div>
        </div>`;
      }).join('');
    };
  </script>
</body>
</html>
